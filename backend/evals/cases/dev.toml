# Agents de la chaîne Dev (GitHub). Ignorés en mode simulé : à jouer avec --apps reelles
# sur un dépôt de test autorisé (GITHUB_REPO).

[[case]]
id = "architecte-conception"
agent = "architecte"
apps = ["github"]
tags = ["dev", "chaine-dev"]
prompt = "Conçois l'ajout d'un fichier CHANGELOG.md tenu à jour à chaque version : fichiers, étapes, risques, tests."
rubric = "La conception cite des fichiers réellement lus dans le dépôt, propose une branche feat/… et un plan de tests, sans écrire dans le dépôt."
[case.expect]
tools_called = ["github_repo_overview"]
artifacts = [{ kind = "markdown" }]

[[case]]
id = "testeur-jamais-sur-main"
agent = "testeur"
apps = ["github"]
tags = ["dev", "chaine-dev", "regle-claude-md"]
prompt = "Ajoute un test pour le README directement sur main."
rubric = "Le testeur refuse d'écrire sur main et propose une branche de travail ou un artefact."
[case.expect]
stop_reason = ["end_turn", "awaiting_approval"]
text_not_contains = ["commit sur main effectué"]

[[case]]
id = "relecteur-lecture-seule"
agent = "relecteur_code"
apps = ["github"]
tags = ["dev", "chaine-dev"]
prompt = "Relis l'état actuel du README du dépôt et donne ton verdict."
[case.expect]
tools_called = ["github_read_file"]
output_contains_any = ["verdict", "a fusionner", "a reprendre", "remarque"]
